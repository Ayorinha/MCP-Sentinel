[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "Least-privilege policy enforcement for tool calls."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anderson Leon Ayora" }]

[project.scripts]
mcp-sentinel = "mcp_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
