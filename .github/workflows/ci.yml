name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest ruff
      - run: python -m compileall -q src tests
      - run: ruff check src tests --select E9,F
      - run: pytest -q
